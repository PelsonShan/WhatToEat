<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日签 · 抽签动画预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #efe3c6;
      color: #5a241d;
      font-family: "Songti SC", "STSong", "KaiTi", "STKaiti", "SimSun", serif;
      padding: 28px 20px 56px;
    }

    .page-head {
      max-width: 1080px;
      margin: 0 auto 26px;
      text-align: center;
    }

    .page-head h1 {
      font-size: 30px;
      letter-spacing: 3px;
      color: #7a1f17;
    }

    .page-head p {
      margin-top: 8px;
      color: #8a5a3b;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .demos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 26px;
      max-width: 1080px;
      margin: 0 auto;
    }

    .demo-col {
      min-width: 0;
    }

    .demo-name {
      text-align: center;
      color: #8a5a3b;
      font-size: 17px;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .phone {
      width: 340px;
      max-width: 100%;
      margin: 0 auto;
      background: #f8ecd0;
      border: 2px solid #9f1d16;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 44px rgba(159, 29, 22, 0.22);
      position: relative;
    }

    .app-header {
      background: #9f1d16;
      color: #f8ecd0;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f2c14e;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .app-header small {
      font-size: 11px;
      font-weight: 400;
      color: #f2d9a4;
      letter-spacing: 0;
    }

    .app-body {
      padding: 14px 18px 18px;
      position: relative;
      min-height: 560px;
    }

    .hello-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hello-row strong {
      font-size: 23px;
      color: #5a241d;
    }

    .stamp {
      display: inline-block;
      background: #b3261e;
      color: #ffe9b3;
      border: 1px solid #f2c14e;
      border-radius: 4px;
      padding: 3px 8px;
      transform: rotate(-3deg);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .mode-row {
      display: flex;
      background: #fff7e0;
      border: 1px solid #d9a441;
      border-radius: 8px;
      overflow: hidden;
      margin: 12px 0 10px;
    }

    .mode-row span {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      color: #6b4a35;
      font-size: 13px;
    }

    .mode-row span.on {
      background: #9f1d16;
      color: #f8ecd0;
      font-weight: 700;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 8px 0 14px;
    }

    .chip {
      text-align: center;
      border: 1px solid #9f1d16;
      color: #9f1d16;
      border-radius: 6px;
      padding: 7px 2px;
      font-size: 12px;
      white-space: nowrap;
    }

    .chip.on {
      background: #9f1d16;
      color: #f2d9a4;
      font-weight: 700;
    }

    .draw-stage {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 8px 0 14px;
    }

    .start-btn {
      border: 0;
      background: #9f1d16;
      color: #f2d9a4;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(159, 29, 22, 0.2);
    }

    .start-btn:active {
      transform: translateY(1px);
    }

    .hint {
      margin-top: 12px;
      color: #8a5a3b;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* 方案 A：今日卦圆盘 */
    .fortune-disc {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: conic-gradient(#b3261e 0 25%, #f2c14e 25% 50%, #d9a441 50% 75%, #b3261e 75% 100%);
      border: 7px solid #d9a441;
      box-shadow: 0 0 0 3px #9f1d16, 0 8px 22px rgba(159, 29, 22, 0.32);
      position: relative;
      margin: 8px 0 14px;
    }

    .fortune-disc::after {
      content: "▼";
      position: absolute;
      left: 50%;
      top: -26px;
      transform: translateX(-50%);
      color: #d9a441;
      font-size: 17px;
    }

    .disc-core {
      position: absolute;
      inset: 24px;
      background: #f8ecd0;
      border: 3px solid #9f1d16;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9f1d16;
    }

    .disc-core small {
      font-size: 12px;
    }

    .disc-core b {
      font-size: 27px;
      margin-top: 2px;
    }

    .spark {
      position: absolute;
      width: 7px;
      height: 7px;
      background: #f2c14e;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .spark.s1 { left: -12px; top: 34px; }
    .spark.s2 { right: -16px; top: 62px; }
    .spark.s3 { left: 20px; bottom: -18px; }

    .fortune-disc.drawing {
      animation: disc-shake 0.42s ease-in-out 2;
    }

    .fortune-disc.drawing .spark {
      animation: sparkle 0.7s ease-out 1.1s forwards;
    }

    .fortune-disc.drawing .spark.s2 {
      animation-delay: 1.25s;
    }

    .fortune-disc.drawing .spark.s3 {
      animation-delay: 1.4s;
    }

    @keyframes disc-shake {
      0%, 100% { transform: translateY(0) rotate(0); }
      20% { transform: translateY(-5px) rotate(-8deg); }
      45% { transform: translateY(2px) rotate(6deg); }
      70% { transform: translateY(-3px) rotate(-5deg); }
    }

    @keyframes sparkle {
      0% { opacity: 0; transform: scale(0.3); }
      35% { opacity: 1; transform: scale(1.25); }
      100% { opacity: 0; transform: scale(0.4) translateY(-12px); }
    }

    /* 方案 B：签筒木签 */
    .sign-jar {
      width: 220px;
      height: 166px;
      position: relative;
      margin: 4px 0 12px;
    }

    .stick {
      position: absolute;
      bottom: 42px;
      width: 12px;
      height: 96px;
      border-radius: 7px 7px 3px 3px;
      background: linear-gradient(90deg, #c9872f 0%, #f2c14e 45%, #f8dfa8 55%, #d9a441 100%);
      box-shadow: inset -2px 0 2px rgba(120, 70, 20, 0.25);
      transform-origin: 50% 100%;
    }

    .stick:nth-child(1) { left: 46px; transform: rotate(-15deg); height: 72px; }
    .stick:nth-child(2) { left: 68px; transform: rotate(-8deg); height: 92px; }
    .stick:nth-child(3) { left: 112px; transform: rotate(8deg); height: 86px; }
    .stick:nth-child(4) { left: 138px; transform: rotate(14deg); height: 74px; }

    .main-stick {
      position: absolute;
      left: 90px;
      bottom: 40px;
      width: 17px;
      height: 118px;
      border-radius: 9px 9px 4px 4px;
      background: linear-gradient(90deg, #b3261e 0%, #e05a43 45%, #ffd9a0 52%, #b3261e 100%);
      box-shadow: inset -3px 0 4px rgba(90, 20, 12, 0.35);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff4d6;
      font-size: 17px;
      font-weight: 800;
      transform-origin: 50% 100%;
    }

    .jar-tube {
      position: absolute;
      left: 26px;
      right: 26px;
      bottom: 0;
      height: 86px;
      background: linear-gradient(180deg, #8f2f24 0%, #6f211a 100%);
      border: 5px solid #d9a441;
      border-top-width: 3px;
      border-radius: 10px 10px 22px 22px;
      box-shadow: inset 0 8px 0 rgba(242, 201, 78, 0.22), 0 8px 16px rgba(90, 36, 29, 0.22);
      z-index: 3;
    }

    .jar-tube::before {
      content: "";
      position: absolute;
      inset: 10px 12px;
      border: 2px solid rgba(248, 236, 208, 0.25);
      border-radius: 6px 6px 14px 14px;
    }

    .sign-jar.drawing .jar-tube,
    .sign-jar.drawing .stick {
      animation: jar-shake 0.42s ease-in-out 2;
    }

    .sign-jar.drawing .main-stick {
      animation: stick-rise 0.42s ease-out 0.86s forwards;
    }

    @keyframes jar-shake {
      0%, 100% { transform: translateY(0) rotate(0); }
      25% { transform: translateY(-2px) rotate(-4deg); }
      55% { transform: translateY(1px) rotate(4deg); }
      80% { transform: translateY(-2px) rotate(-2deg); }
    }

    @keyframes stick-rise {
      from { transform: translateY(0) rotate(0); }
      to { transform: translateY(-92px) rotate(7deg); }
    }

    .draw-stage .note {
      color: #8a5a3b;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* 签文揭晓 */
    .fortune-card {
      position: absolute;
      inset: 0;
      background: rgba(90, 36, 29, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10;
    }

    .fortune-card.show {
      opacity: 1;
      pointer-events: auto;
    }

    .fortune-paper {
      width: 100%;
      background: #fff7e0;
      border: 2px dashed #b3261e;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(90, 36, 29, 0.25);
      transform: translateY(16px) scale(0.96);
      opacity: 0;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    }

    .fortune-card.show .fortune-paper {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .paper-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .paper-title {
      font-size: 15px;
      color: #5a241d;
      font-weight: 700;
    }

    .paper-seal {
      display: inline-block;
      background: #b3261e;
      color: #ffe9b3;
      border: 1px solid #f2c14e;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      transform: scale(0.2) rotate(-8deg);
      opacity: 0;
    }

    .fortune-card.show .paper-seal {
      animation: stamp-in 0.32s ease 0.42s forwards;
    }

    @keyframes stamp-in {
      from { transform: scale(0.2) rotate(-12deg); opacity: 0; }
      to { transform: scale(1) rotate(-3deg); opacity: 1; }
    }

    .dish-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 46px;
    }

    .dish {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #d8b06a;
      border-radius: 18px;
      padding: 5px 9px;
      font-size: 13px;
      color: #5a241d;
      background: #f8ecd0;
      transform: translateY(8px);
      opacity: 0;
    }

    .dish .cat {
      background: #9f1d16;
      color: #f8ecd0;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
    }

    .fortune-card.show .dish {
      animation: dish-in 0.3s ease forwards;
    }

    .fortune-card.show .dish:nth-child(2) { animation-delay: 0.16s; }
    .fortune-card.show .dish:nth-child(3) { animation-delay: 0.32s; }
    .fortune-card.show .dish:nth-child(4) { animation-delay: 0.48s; }

    @keyframes dish-in {
      to { transform: translateY(0); opacity: 1; }
    }

    .again {
      width: 100%;
      border: 1px solid #9f1d16;
      background: #f8ecd0;
      color: #9f1d16;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 0;
      border-radius: 6px;
      margin-top: 14px;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .demos {
        grid-template-columns: 1fr;
      }

      .demo-col + .demo-col {
        margin-top: 22px;
      }
    }
  </style>
</head>
<body>
  <header class="page-head">
    <h1>今日签 · 抽签动画预览</h1>
    <p>左边保留今日卦圆盘，右边换成签筒抽木签</p>
  </header>

  <main class="demos">
    <section class="demo-col">
      <div class="demo-name">方案 A · 今日卦摇签揭晓</div>
      <div class="phone">
        <div class="app-header">今日签 <small>巳时 · 宜开饭</small></div>
        <div class="app-body">
          <div class="hello-row">
            <strong>今日好胃口</strong>
            <span class="stamp">今日签</span>
          </div>
          <div class="mode-row"><span class="on">灶下</span><span>市井</span></div>
          <div class="chips">
            <span class="chip">一菜一汤</span>
            <span class="chip">两菜一汤</span>
            <span class="chip on">三菜一汤</span>
            <span class="chip">自由单点</span>
          </div>

          <div class="draw-stage">
            <div class="fortune-disc">
              <span class="spark s1"></span>
              <span class="spark s2"></span>
              <span class="spark s3"></span>
              <div class="disc-core">
                <small>今日卦</small>
                <b>吉</b>
              </div>
            </div>
            <button class="start-btn">点今日卦</button>
            <div class="note">轻摇后揭晓今日签文</div>
          </div>

          <div class="fortune-card">
            <div class="fortune-paper">
              <div class="paper-head">
                <span class="paper-title">三菜一汤 · 今日签文</span>
                <span class="paper-seal">上上签</span>
              </div>
              <div class="dish-list">
                <span class="dish"><span class="cat">主菜</span>红烧肉</span>
                <span class="dish"><span class="cat">主菜</span>清蒸鲈鱼</span>
                <span class="dish"><span class="cat">主菜</span>小炒黄牛肉</span>
                <span class="dish"><span class="cat">汤</span>番茄蛋汤</span>
              </div>
              <button class="again">再看一次</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="demo-col">
      <div class="demo-name">方案 B · 签筒抽签揭晓</div>
      <div class="phone">
        <div class="app-header">今日签 <small>巳时 · 宜开饭</small></div>
        <div class="app-body">
          <div class="hello-row">
            <strong>今日好胃口</strong>
            <span class="stamp">今日签</span>
          </div>
          <div class="mode-row"><span class="on">灶下</span><span>市井</span></div>
          <div class="chips">
            <span class="chip">一菜一汤</span>
            <span class="chip">两菜一汤</span>
            <span class="chip on">三菜一汤</span>
            <span class="chip">自由单点</span>
          </div>

          <div class="draw-stage">
            <div class="sign-jar">
              <span class="stick"></span>
              <span class="stick"></span>
              <span class="stick"></span>
              <span class="stick"></span>
              <span class="main-stick">签</span>
              <span class="jar-tube"></span>
            </div>
            <button class="start-btn">抽一支签</button>
            <div class="note">木签抽出后揭晓今日签文</div>
          </div>

          <div class="fortune-card">
            <div class="fortune-paper">
              <div class="paper-head">
                <span class="paper-title">三菜一汤 · 今日签文</span>
                <span class="paper-seal">上上签</span>
              </div>
              <div class="dish-list">
                <span class="dish"><span class="cat">主菜</span>红烧肉</span>
                <span class="dish"><span class="cat">主菜</span>清蒸鲈鱼</span>
                <span class="dish"><span class="cat">主菜</span>小炒黄牛肉</span>
                <span class="dish"><span class="cat">汤</span>番茄蛋汤</span>
              </div>
              <button class="again">再看一次</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll('.demo-col').forEach(function (demo) {
      var start = demo.querySelector('.start-btn');
      var card = demo.querySelector('.fortune-card');
      var target = demo.querySelector('.fortune-disc, .sign-jar');
      var running = false;

      start.addEventListener('click', function () {
        if (running) return;
        running = true;
        card.classList.remove('show');
        target.classList.remove('drawing');
        void target.offsetWidth;
        target.classList.add('drawing');

        setTimeout(function () {
          card.classList.add('show');
        }, 1120);
      });

      demo.querySelector('.again').addEventListener('click', function () {
        card.classList.remove('show');
        running = false;
      });
    });
  </script>
</body>
</html>
